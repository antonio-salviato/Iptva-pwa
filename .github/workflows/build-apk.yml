name: Build APK on Every Push and Pull Request

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Auto Determine Version
      id: version_bump
      run: |
        RUN_NUMBER=${{ github.run_number }}
        NEW_VERSION_CODE=$((10 + RUN_NUMBER))
        NEW_VERSION_NAME="1.0.${RUN_NUMBER}"
        
        echo "NEW_VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_ENV
        echo "NEW_VERSION_NAME=$NEW_VERSION_NAME" >> $GITHUB_ENV

        cat <<EOF > version.json
        {
          "versionCode": $NEW_VERSION_CODE,
          "versionName": "$NEW_VERSION_NAME",
          "releaseNotes": "Atualização automática de compilação #${RUN_NUMBER} gerada via GitHub Actions.",
          "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${NEW_VERSION_NAME}/Firehair_IPTV_v${NEW_VERSION_NAME}.apk"
        }
        EOF

    - name: Generate Debug Keystore if missing
      run: |
        if [ ! -f "debug.keystore" ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        fi

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Prepare Official APK Output
      run: |
        mkdir -p build_output
        cp app/build/outputs/apk/debug/app-debug.apk build_output/Firehair_IPTV_v${{ env.NEW_VERSION_NAME }}.apk
        cp app/build/outputs/apk/debug/app-debug.apk Firehair_IPTV_v${{ env.NEW_VERSION_NAME }}.apk

    # ALWAYS uploads APK artifact on every push or pull request
    - name: Upload Official APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Firehair_IPTV_v${{ env.NEW_VERSION_NAME }}_APK
        path: build_output/Firehair_IPTV_v${{ env.NEW_VERSION_NAME }}.apk
        retention-days: 30

    - name: Commit version.json (Only on push to main or master)
      if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
      continue-on-error: true
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add version.json
        git commit -m "[CI] Auto bump version to v${{ env.NEW_VERSION_NAME }}" || true
        git push origin ${{ github.ref_name }} || true

    - name: Create GitHub Release (Only on push to main or master)
      if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
      uses: softprops/action-gh-release@v2
      continue-on-error: true
      with:
        tag_name: "v${{ env.NEW_VERSION_NAME }}"
        target_commitish: ${{ github.sha }}
        name: "Firehair IPTV Player v${{ env.NEW_VERSION_NAME }}"
        body: "Nova versão v${{ env.NEW_VERSION_NAME }} gerada automaticamente via GitHub Actions!"
        files: |
          Firehair_IPTV_v${{ env.NEW_VERSION_NAME }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
